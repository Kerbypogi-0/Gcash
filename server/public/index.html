<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Transfer</title>
  <link rel="stylesheet" href="/public/styles.css" />
</head>
<body>
  <main class="container">
    <h1>File Transfer</h1>
    <form id="uploadForm">
      <div id="drop" class="drop">
        <p>Drag & drop files or folders here</p>
        <input id="fileInput" type="file" multiple webkitdirectory directory />
      </div>
      <button type="submit">Upload</button>
    </form>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <pre id="result"></pre>
  </main>
  <script src="/public/main.js" defer></script>
  <script>
    // health check ping
    fetch('/api/health').catch(()=>{});
  </script>
</body>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0b1020;color:#e8e9f1;margin:0}
  .container{max-width:840px;margin:40px auto;padding:0 20px}
  .drop{border:2px dashed #3a3f5a;border-radius:12px;padding:32px;text-align:center;background:#121735}
  .drop.dragover{background:#1a224d;border-color:#5f74f5}
  input[type=file]{margin-top:12px}
  button{margin-top:16px;padding:10px 16px;border-radius:8px;border:none;background:#5f74f5;color:#fff;cursor:pointer}
  .progress{height:10px;background:#1a224d;border-radius:999px;margin-top:16px;overflow:hidden}
  .bar{height:100%;width:0;background:#20c997;transition:width .1s linear}
  pre{background:#0e1430;padding:16px;border-radius:8px;overflow:auto}
  a{color:#8fd3ff}
</style>
</html>
